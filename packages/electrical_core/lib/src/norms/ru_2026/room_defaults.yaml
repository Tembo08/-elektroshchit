# Шаблоны комнат и потребителей по умолчанию
# version: ru_2026

templates:
  studio:
    name: "Студия"
    object_type: apartment
    rooms:
      - type: kitchen
        name: "Кухня-гостиная"
        area: 20
        consumers:
          - { type: socket, name: "Розетки", quantity: 8 }
          - { type: lightPoint, name: "Светильники", quantity: 4 }
          - { type: refrigerator, name: "Холодильник", quantity: 1, is_powerful: false }
          - { type: hood, name: "Вытяжка", quantity: 1 }

  one_room:
    name: "1-комнатная"
    object_type: apartment
    rooms:
      - type: kitchen
        name: "Кухня"
        area: 10
        consumers:
          - { type: socket, name: "Розетки", quantity: 6 }
          - { type: lightPoint, name: "Свет", quantity: 2 }
          - { type: refrigerator, name: "Холодильник", quantity: 1 }
      - type: livingRoom
        name: "Комната"
        area: 16
        consumers:
          - { type: socket, name: "Розетки", quantity: 6 }
          - { type: lightPoint, name: "Свет", quantity: 3 }
      - type: bathroom
        name: "Ванная"
        area: 4
        consumers:
          - { type: socket, name: "Розетка", quantity: 1 }
          - { type: lightPoint, name: "Свет", quantity: 1 }
          - { type: washingMachine, name: "Стиральная машина", quantity: 1, power_kw: 2.0, is_powerful: true }
      - type: hallway
        name: "Коридор"
        area: 5
        consumers:
          - { type: socket, name: "Розетка", quantity: 1 }
          - { type: lightPoint, name: "Свет", quantity: 1 }

# Значения мощности по умолчанию для мощных потребителей (кВт)
default_power_kw:
  electricStove: 7.0
  oven: 3.5
  dishwasher: 2.0
  washingMachine: 2.0
  waterHeater: 2.0
  airConditioner: 2.5
  underfloorHeating: 1.5
  evCharger: 7.0
  boiler: 9.0
  refrigerator: 0.3
  hood: 0.2
